# Builds an installable debug APK in the cloud (no PC or Android Studio needed).
# Runs on every push to main/master, or manually: Actions tab > "Build APK" > Run workflow.
# The APK is attached to a GitHub Release and also saved as a run artifact.
# Install app-debug.apk on your phone (allow installs from unknown sources).
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar is not in the repo, so Gradle is installed here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostExpress-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Frost Express debug build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

      # If the build breaks, publish the full build log so the error can be read without logging in.
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-failed
          name: Failed build ${{ github.run_number }} (log)
          prerelease: true
          files: build.log
