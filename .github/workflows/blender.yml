# Renders the 3D character sprites with Blender (headless, Cycles on CPU) and publishes the
# frames plus a preview video to a GitHub Release named blender-<run number>.
name: Blender render

on:
  push:
    branches: [main]
    paths: ['blender/**', '.github/workflows/blender.yml']
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 ffmpeg zip > /dev/null
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ
          echo "$PWD/blender-4.2.3-linux-x64" >> $GITHUB_PATH
      - name: Render
        run: |
          pip install -q pillow || true
          # only the scripts this push changed (all of them on a manual run or when none changed)
          scripts=""
          if [ "${{ github.event_name }}" = "push" ]; then
            scripts=$(git diff --name-only HEAD~1 HEAD -- 'blender/*.py' | grep -v '^blender/old/' || true)
          fi
          [ -z "$scripts" ] && scripts=$(ls blender/*.py)
          echo "rendering: $scripts"
          for s in $scripts; do
            name=$(basename "$s" .py)
            blender -b -P "$s" -- "out/$name" 2>&1 | grep -E "^done|Error|Traceback|error|line [0-9]" | tail -200
            (cd out && zip -qr "${name}_frames.zip" "$name")
            python3 - "out/$name" "out/${name}_lineup.png" <<'PY' || true
          import sys, os
          from PIL import Image
          d, out = sys.argv[1], sys.argv[2]
          chars = sorted(x for x in os.listdir(d) if os.path.isdir(os.path.join(d, x)))
          if not chars:
              # flat renders (scenery): a labelled contact sheet
              from PIL import ImageDraw
              fs = sorted(x for x in os.listdir(d) if x.endswith('.png'))
              T, C = 200, 8
              W = Image.new('RGBA', (T * C, ((len(fs) + C - 1) // C) * (T + 16)), (200, 222, 205, 255))
              dr = ImageDraw.Draw(W)
              for i, f in enumerate(fs):
                  im = Image.open(os.path.join(d, f)).convert('RGBA'); im.thumbnail((T - 8, T - 8))
                  x, y = (i % C) * T, (i // C) * (T + 16)
                  W.alpha_composite(im, (x + (T - im.width) // 2, y + (T - im.height) // 2))
                  dr.text((x + 4, y + T), f[:-4], fill=(40, 40, 40, 255))
              W.save(out)
          if chars:
              names = ['idle_00', 'walk_02', 'side_02', 'sit_00']
              im0 = Image.open(os.path.join(d, chars[0], 'idle_00.png'))
              W = Image.new('RGBA', (im0.width * len(chars), im0.height * len(names)), (234, 244, 238, 255))
              for k, c in enumerate(chars):
                  for r, n in enumerate(names):
                      p = os.path.join(d, c, n + '.png')
                      if os.path.exists(p):
                          W.alpha_composite(Image.open(p).convert('RGBA'), (k * im0.width, r * im0.height))
              W.save(out)
          PY
          done
          ls -la out
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: blender-${{ github.run_number }}
          name: Blender render ${{ github.run_number }}
          prerelease: true
          files: |
            out/*_frames.zip
            out/*_lineup.png
