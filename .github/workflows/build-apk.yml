# Builds an installable debug APK in the cloud (no PC or Android Studio needed).
# Runs on every push to main/master, or manually: Actions tab > "Build APK" > Run workflow.
# The APK is attached to a GitHub Release and also saved as a run artifact.
# Install app-debug.apk on your phone (allow installs from unknown sources).
name: Build APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['blender/**', '.github/workflows/blender.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle wrapper jar is not in the repo, so Gradle is installed here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          prerelease: true
          files: build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostExpress-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Little Express debug build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

      # Play Store bundle (release, shrunk with R8). If the upload key is stored in the repository
      # secrets (UPLOAD_KEYSTORE_B64, UPLOAD_KEYSTORE_PASSWORD) the bundle comes out signed and ready
      # to upload; otherwise it is built unsigned.
      - name: Upload key from secrets
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        if: env.KS_B64 != ''
        shell: bash
        run: |
          echo "$KS_B64" | base64 -d > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties

      - name: Build release bundle (AAB)
        id: aab
        continue-on-error: true
        shell: bash
        run: gradle bundleRelease assembleReleaseTest --no-daemon 2>&1 | tee release.log

      - name: Publish release bundle
        if: steps.aab.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/apk/releaseTest/app-releaseTest.apk

      - name: Publish release build log
        if: steps.aab.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: release.log

      # Screenshots of the game on several phone sizes (does not block the APK above).
      - name: Render screenshots on several screen sizes
        id: shots
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          gradle testDebugUnitTest --tests "com.chetna.frostexpress.SmokeTest" --tests "com.chetna.frostexpress.ScreenshotTest" --no-daemon 2>&1 | tee test.log

      - name: Pack screenshots
        id: pack
        if: always()
        continue-on-error: true
        shell: bash
        run: cd app/build/screens && zip -q ../../../screens.zip *.png

      - name: Publish screenshots
        if: always() && steps.pack.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: screens.zip

      - name: Publish screenshot test log
        if: steps.shots.outcome != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: test.log

      # If the build breaks, publish the full build log so the error can be read without logging in.
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-failed
          name: Failed build ${{ github.run_number }} (log)
          prerelease: true
          files: build.log
