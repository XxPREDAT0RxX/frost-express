# Cloud pe installable APK banata hai (PC ya Android Studio ki zarurat nahi).
# Use: is poore project ko GitHub repo me push karo > Actions tab > "Build APK" > Run workflow.
# Khatam hone ke baad usi run ke page pe neeche "Artifacts" me FrostExpress-debug-apk download karo,
# zip kholo aur app-debug.apk phone me install karo (Unknown sources allow karna padega).
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradlew/wrapper jar repo me nahi hai, isliye Gradle yahin install hota hai.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FrostExpress-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
